name: Markdown Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  markdownlint:
    name: runner / markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: generate cultivator token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: generate-token
        with:
          app-id: "${{ secrets.EDERA_CULTIVATION_APP_ID }}"
          private-key: "${{ secrets.EDERA_CULTIVATION_APP_PRIVATE_KEY }}"
          # Scope to only what reviewdog's github-pr-review reporter needs:
          # posting review comments on the PR.
          permission-pull-requests: write

      - name: markdownlint
        uses: step-security/action-markdownlint@f43d01d3873bff3c71120dace5ecf7260bebe112
        with:
          GITHUB_TOKEN: "${{ steps.generate-token.outputs.token }}"
          reporter: github-pr-review
          level: warning
          fail_level: error
          markdownlint_flags: '--config .markdownlint.json .'
        continue-on-error: false

