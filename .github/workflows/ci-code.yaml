name: Lint and Test Code

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read # Default token to read

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: 'cargo fmt'
        run: cargo fmt --all -- --check

  full-build:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - { arch: x86_64, on: ubuntu-latest }
        - { arch: aarch64, on: ubuntu-24.04-arm }
    runs-on: "${{ matrix.platform.on }}"
    env:
      TARGET_ARCH: "${{ matrix.platform.arch }}"
    name: 'Full build linux-${{ matrix.platform.arch }}'
    steps:
      - name: harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: cargo build
        run: cargo build

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
        - x86_64
    env:
      TARGET_ARCH: "${{ matrix.arch }}"
    name: 'Full clippy linux-${{ matrix.arch }}'
    steps:
      - name: harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: 'cargo clippy'
        run: cargo clippy

  image-build:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - { arch: x86_64, on: ubuntu-latest }
        - { arch: aarch64, on: ubuntu-24.04-arm }
    runs-on: "${{ matrix.platform.on }}"
    name: 'Image build linux-${{ matrix.platform.arch }}'
    steps:
      - name: harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The release workflow builds this image, with its static musl binary, only when a
      # release is published.
      - name: docker build
        run: docker build --file images/Containerfile.edera-check .
